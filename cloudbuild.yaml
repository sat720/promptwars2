steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--build-arg', 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}',
      '--build-arg', 'NEXT_PUBLIC_GOOGLE_CLOUD_API_KEY=${_NEXT_PUBLIC_GOOGLE_CLOUD_API_KEY}',
      '--build-arg', 'NEXT_PUBLIC_GA_MEASUREMENT_ID=${_NEXT_PUBLIC_GA_MEASUREMENT_ID}',
      '-t', 'gcr.io/$PROJECT_ID/votewise',
      '.'
    ]
images:
  - 'gcr.io/$PROJECT_ID/votewise'
